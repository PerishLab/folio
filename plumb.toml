[identity]
ns = "folio"

[release]
authority = "https://releases.folio.perish.uk"
binaries = ["folio-api"]
targets = ["x86_64-unknown-linux-gnu"]
skill = false

[release.cargo]
registry = "perish"
packages = ["folio"]

[release.oci]
registry = "ghcr.io"
account = "PerishLab"

[release.oci.components.api]
image = "perishlab/folio"
binary = "folio-api"

[release.oci.components.web]
image = "perishlab/folio-web"
web = "apps/web"
file = "deploy/web.Dockerfile"

[release.chart]
registry = "ghcr.io"
chart = "perishlab/folio"
account = "PerishLab"

[layout]
[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "Settings control library and API service."

[[layout.seat]]
path = "apps/*"
anchor = []
note = "Independent Web application and its tests."

[[layout.seat]]
path = "deploy"
note = "Web image build context and deployment assets."

[[layout.seat]]
path = "charts/*"
anchor = ["Chart.yaml"]
note = "Formal Helm service declaration."

[[layout.seat]]
path = ".cargo"
note = "Public registry configuration."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Workspace and dependency resolution."

[[layout.file]]
name = [".npmrc", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "biome.json"]
note = "Workspace anchors held for the web plane."

[[layout.file]]
name = ["Containerfile"]
note = "API image built from its formal binary."

[[layout.file]]
name = ["README.md"]
note = "Public API and deployment entry."

[sidecar.project]
name = "folio"
namespace = "folio"
root = "."

[sidecar.app]
name = "web"
command = "pnpm"
args = ["--filter", "@perishlab/folio-web", "dev", "--host", "127.0.0.1"]
cwd = "."
mode = "dev"
port = 0
health_url = "http://127.0.0.1:{port}"
inherits_env = [{ name = "API_URL", from = "api.endpoint" }]

[[sidecar.sidecars]]
name = "api"
command = "cargo"
args = ["run", "--locked", "-p", "api", "--", "serve", "."]
cwd = "."
mode = "dev"
port = 0
env = { SIDECAR_PORT = "{port}" }
health_url = "http://127.0.0.1:{port}/api/health"
ready = { role = "api" }

[[sidecar.sidecars]]
name = "web-built"
command = "node"
args = ["apps/web/dist/.perish/server.mjs", "apps/web/dist"]
cwd = "."
mode = "built"
port = 0
env = { HOST = "127.0.0.1", PORT = "{port}" }
health_url = "http://127.0.0.1:{port}"
inherits_env = [{ name = "API_URL", from = "api.endpoint" }]
