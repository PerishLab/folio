apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  folio.toml: |
    issuer = {{ required "issuer is required" .Values.issuer | toJson }}
    audience = {{ .Values.audience | toJson }}
    keys = "/config/jwks.json"
    data = "/data/state"
    listen = "0.0.0.0:8080"
{{- if .Values.apps }}
    apps = {{ .Values.apps | toJson }}
{{- end }}
{{- if .Values.locus.enabled }}
    [locus]
    endpoint = {{ required "locus.endpoint is required when locus.enabled is true" .Values.locus.endpoint | toJson }}
    producer = {{ .Values.locus.producer | default "folio-web" | toJson }}
    buffer = "/data/locus-relay"
{{- if .Values.locus.origins }}
    origins = {{ join "," .Values.locus.origins | toJson }}
{{- end }}
    rpm = {{ .Values.locus.rpm | default 120 }}
    burst = {{ .Values.locus.burst | default 30 }}
    forwarded = {{ if eq (toString .Values.locus.forwarded) "false" }}false{{ else }}true{{ end }}
{{- end }}
  jwks.json: {{ required "trusted public jwks is required" .Values.jwks | toJson | quote }}
