{{- $web := .Values.web | default dict }}
{{- if $web.enabled }}
{{- $clientCfg := $web.client | default dict }}
{{- $webImage := $web.image | default dict }}
{{- $locus := .Values.locus | default dict }}
{{- $webPort := $web.port | default 8080 }}
{{- $client := dict }}
{{- if $clientCfg.client }}
{{- $issuer := $clientCfg.issuer | default .Values.issuer }}
{{- $_ := set $client "client" $clientCfg.client }}
{{- if $issuer }}
{{- $_ := set $client "issuer" $issuer }}
{{- end }}
{{- $audience := $clientCfg.audience | default .Values.audience }}
{{- if $audience }}
{{- $_ := set $client "audience" $audience }}
{{- end }}
{{- if $clientCfg.endpoint }}
{{- $_ := set $client "endpoint" $clientCfg.endpoint }}
{{- end }}
{{- end }}
{{- if $locus.enabled }}
{{- $_ := set $client "observe" "/api/observe" }}
{{- end }}
{{- $payload := $client | toJson }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-web-client
data:
  client.json: {{ $payload | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
spec:
  replicas: {{ $web.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: folio-web
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: folio-web
      annotations:
        checksum/client: {{ $payload | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: web
          image: "{{ $webImage.repository | default "ghcr.io/perishlab/folio-web" }}:{{ $webImage.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $webImage.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ $webPort | quote }}
          ports:
            - name: http
              containerPort: {{ $webPort }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: client
              mountPath: /web/dist/client.json
              subPath: client.json
              readOnly: true
      volumes:
        - name: client
          configMap:
            name: {{ .Release.Name }}-web-client
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: folio-web
  ports:
    - name: http
      port: {{ $webPort }}
      targetPort: http
{{- end }}
